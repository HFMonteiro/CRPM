[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crpm"
version = "0.3.0"
description = "Process mining workbench for colorectal cancer screening programs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Hugo Monteiro" }
]
keywords = ["process-mining", "healthcare", "colorectal-cancer", "screening", "conformance", "pm4py"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "streamlit>=1.44",
  "streamlit-cytoscape",
  "pm4py>=2.7.22,<2.8",
  "pandas>=2.2",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "plotly>=5.24",
  "lxml>=5.3",
  "fpdf2>=2.8",
  "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.15.12",
  "black==25.1.0",
  "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/HFMonteiro/CRPM"
Issues = "https://github.com/HFMonteiro/CRPM/issues"

[project.scripts]
crpm-preflight = "crpm.preflight:main"
crpm-release-check = "crpm.release_check:main"
crpm-generate-screening-demo = "crpm.synthetic_screening:main"
crpm-analyze = "crpm.batch_cli:main"

[tool.setuptools]
packages = ["crpm", "crpm.assets", "crpm.pages"]

[tool.setuptools.package-data]
crpm = ["assets/*", "py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.black]
target-version = ["py310"]
line-length = 140

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["E402"]
"app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

