name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Repo hygiene
        run: |
          if git ls-files | grep -E '(^outputs/|\.log$|\.pid$|^\.venv/|^\.pytest_cache/|^pytest-cache-files-)'; then
            echo "Local runtime or cache artefacts are tracked in git."
            exit 1
          fi

      - name: Preflight smoke test
        run: python -m crpm.preflight

      - name: Run preflight tests
        run: pytest tests/test_preflight.py -v --tb=short

      - name: Boot Streamlit shell
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          python - <<'PY'
          import time
          import urllib.request

          deadline = time.time() + 30
          last_error = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          raise SystemExit(f"Streamlit health check did not pass: {last_error}")
          PY
          kill $APP_PID

      - name: Run tests
        run: pytest tests/ -v --tb=short
